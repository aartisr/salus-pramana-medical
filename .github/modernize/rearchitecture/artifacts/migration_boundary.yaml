  - { path: server.ts, reason: "authoritative active POST /api/clinical-ai contract and deterministic fallback must execute on Express 4.21" }
  - { path: archive/legacy-monorepo/apps/web/src/**, reason: "archived-only dashboard, submission, comparison, editor, PKCE, and math capabilities are required for complete parity" }
  - { path: archive/legacy-monorepo/packages/domain/src/**, reason: "shared validation and serialized medical/evidence contracts are required by restored API and ingestion surfaces" }
  - { path: archive/legacy-monorepo/services/api/src/**, reason: "all frozen endpoint, auth, audit, deterministic intelligence, and repository behavior must be restored under Express 4.21" }
  - { path: archive/legacy-monorepo/services/ingestion/src/**, reason: "all four required ingestion entrypoints and their bounded connector semantics must run in the target" }
copy_as_is:
  - public/robots.txt
  - public/sitemap.xml
  - public/llms.txt
  - public/llms-full.txt
legacy_allowed_to_remain:
  - archive/legacy-monorepo/**
  - src/**
  - server.ts
defer_cleanup:
