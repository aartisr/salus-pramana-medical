  - "Active-root capability removal is prohibited; the source repository remains the comparison baseline."
full_rewrite_reason: "The user explicitly requires complete active-plus-archived capability parity in an isolated sibling runtime that may not depend on source/archive files; every listed runtime surface must therefore be reimplemented, while cleanup remains forbidden."
implementation_rule: "Implementation consumes must_rewrite as capability-bearing source scope and writes only to /Users/rraviku2/aarti/salus-pramana-medical-new. Source anchors are evidence, not permission to edit source files."