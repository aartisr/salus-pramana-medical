    - "all archived web, API, auth, persistence, domain, and ingestion capability reaches the target runtime"
    - "fixed target stack and full validation pass"
    - "source repository and archive remain unchanged"
  cleanup_required: false
strategy: full_rewrite
runtime_reachable:
