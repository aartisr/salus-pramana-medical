  - src/app/**
  - src/routes/**
  - src/components/**
  - src/services/**
  - src/data/**
  - src/types/**
  - server.ts
  - archive/legacy-monorepo/apps/web/src/**
  - archive/legacy-monorepo/packages/domain/src/**
  - archive/legacy-monorepo/services/api/src/**
  - archive/legacy-monorepo/services/ingestion/src/**
must_rewrite:
